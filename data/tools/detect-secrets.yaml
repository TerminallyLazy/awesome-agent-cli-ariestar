name: detect-secrets
binary: detect-secrets
aliases: []
category:
- security
lang:
- all
platform:
- local
summary: Secret scanner and baseline tool for preventing committed credentials.
homepage: https://github.com/Yelp/detect-secrets
docs: https://github.com/Yelp/detect-secrets#readme
detect:
  version_args:
  - --version
  local:
    files:
    - .secrets.baseline
    dirs: []
    package_json:
      package_manager_prefixes: []
use_when:
- Scan staged or repository files for accidental secrets
- Maintain a reviewed secrets baseline in repositories that use detect-secrets
avoid_when:
- Scan output would expose secret values in public logs or issue comments
risk:
  level: high
  effects:
  - read_files
  - write_files
  - secret_exposure
  requires_auth: false
  destructive: false
  confirmation_required_for:
  - updating a secrets baseline
  - sharing scan output from private repositories
guardrails:
- Redact secret values from reports and logs.
- Review baseline updates carefully so real credentials are not accepted as false positives.
